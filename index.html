<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Your Name — Mobile Developer</title>
<meta name="description" content="Portfolio of a mobile developer. Seven apps, built end to end.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ============================================================
   TOKENS
   ============================================================ */
:root{
  --ink:        #0A0810;
  --wall-top:   #241A3E;
  --wall-mid:   #16182F;
  --wall-btm:   #0C0F1C;
  --glass:      rgba(255,255,255,.065);
  --glass-2:    rgba(255,255,255,.10);
  --line:       rgba(255,255,255,.13);
  --text:       #F4F1FA;
  --muted:      #A29CB8;
  --dim:        #6E6885;
  --apricot:    #FFB367;
  --mint:       #6FE3C0;
  --rose:       #FF7E9D;

  --display: "Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
  --body:    "Figtree", ui-sans-serif, system-ui, sans-serif;
  --mono:    "JetBrains Mono", ui-monospace, monospace;

  --ease: cubic-bezier(.22,1,.36,1);
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:
    radial-gradient(900px 700px at 12% -10%, #2A1B4A 0%, transparent 60%),
    radial-gradient(700px 600px at 100% 110%, #14304A 0%, transparent 55%),
    var(--ink);
  color:var(--text);
  font-family:var(--body);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--apricot);outline-offset:3px;border-radius:6px}

/* ============================================================
   STAGE
   ============================================================ */
.stage{
  min-height:100dvh;
  display:flex;align-items:center;justify-content:center;
  gap:clamp(32px,7vw,110px);
  padding:40px 24px;
}

/* --- left column ------------------------------------------ */
.intro{max-width:400px;flex-shrink:1}
.eyebrow{
  font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--apricot);display:flex;align-items:center;gap:9px;margin-bottom:22px;
}
.eyebrow::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--apricot);
  box-shadow:0 0 0 0 rgba(255,179,103,.6);animation:pulse 2.6s infinite}
@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(255,179,103,.55)}
  70%{box-shadow:0 0 0 11px rgba(255,179,103,0)}
  100%{box-shadow:0 0 0 0 rgba(255,179,103,0)}
}
.intro h1{
  font-family:var(--display);
  font-size:clamp(46px,5.6vw,78px);
  font-weight:800;line-height:.94;letter-spacing:-.035em;
  margin-bottom:20px;
}
.intro h1 em{font-style:normal;display:block;color:var(--mint)}
.intro p{color:var(--muted);font-size:16.5px;line-height:1.65;max-width:38ch}
.intro .hint{
  margin-top:30px;font-family:var(--mono);font-size:12px;color:var(--dim);
  display:flex;align-items:center;gap:10px;
}
.intro .hint svg{flex-shrink:0}
.social{display:flex;gap:10px;margin-top:34px;flex-wrap:wrap}
.social a{
  font-family:var(--mono);font-size:11.5px;letter-spacing:.05em;
  padding:9px 15px;border:1px solid var(--line);border-radius:999px;
  text-decoration:none;color:var(--muted);
  transition:.25s var(--ease);
}
.social a:hover{color:var(--text);border-color:rgba(255,255,255,.35);background:var(--glass);transform:translateY(-2px)}

/* ============================================================
   DEVICE
   ============================================================ */
.device{
  position:relative;flex-shrink:0;
  width:min(390px,92vw);
  height:min(830px,86dvh);
  border-radius:52px;
  padding:11px;
  background:linear-gradient(160deg,#3A3550,#141220 45%,#2C2840);
  box-shadow:
    0 0 0 1px rgba(255,255,255,.09),
    0 48px 90px -20px rgba(0,0,0,.85),
    0 0 130px -40px rgba(120,80,220,.5);
}
.screen{
  position:relative;width:100%;height:100%;
  border-radius:42px;overflow:hidden;
  background:linear-gradient(178deg,var(--wall-top),var(--wall-mid) 52%,var(--wall-btm));
  isolation:isolate;
}
.screen::after{ /* ambient wallpaper glow */
  content:"";position:absolute;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(320px 240px at 78% 8%, rgba(255,179,103,.20), transparent 70%),
    radial-gradient(300px 300px at 8% 88%, rgba(111,227,192,.14), transparent 70%);
}

/* --- status bar ------------------------------------------- */
.statusbar{
  position:absolute;top:0;left:0;right:0;height:46px;z-index:30;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 26px;font-size:13px;font-weight:600;letter-spacing:.01em;
  pointer-events:none;
}
.statusbar .icons{display:flex;align-items:center;gap:6px;opacity:.9}
.notch{
  position:absolute;top:9px;left:50%;transform:translateX(-50%);
  width:96px;height:27px;border-radius:999px;background:#07060C;z-index:31;
}

/* --- home screen ------------------------------------------ */
.home{
  position:absolute;inset:0;z-index:10;
  display:flex;flex-direction:column;
  padding:56px 20px 0;
  overflow-y:auto;overflow-x:hidden;
  scrollbar-width:none;
}
.home::-webkit-scrollbar{display:none}

.widget{
  display:flex;gap:14px;align-items:center;
  background:var(--glass);border:1px solid var(--line);
  backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
  border-radius:24px;padding:14px;margin-bottom:26px;
}
.avatar{
  width:56px;height:56px;border-radius:18px;flex-shrink:0;overflow:hidden;
  background:linear-gradient(145deg,var(--apricot),var(--rose));
  display:grid;place-items:center;
  font-family:var(--display);font-weight:800;font-size:22px;color:#1A1024;
}
.avatar img{width:100%;height:100%;object-fit:cover}
.widget .who{flex:1;min-width:0}
.widget .who strong{
  display:block;font-family:var(--display);font-size:17px;font-weight:600;letter-spacing:-.01em;
}
.widget .who span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.badge{
  display:inline-flex;align-items:center;gap:5px;margin-top:7px;
  font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--mint);background:rgba(111,227,192,.11);
  border:1px solid rgba(111,227,192,.28);padding:3px 8px;border-radius:999px;
}
.badge i{width:5px;height:5px;border-radius:50%;background:var(--mint)}
.widget .cv{
  align-self:stretch;display:grid;place-items:center;padding:0 14px;
  border-left:1px solid var(--line);
  font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--muted);
  text-decoration:none;text-align:center;line-height:1.5;transition:color .2s
}
.widget .cv:hover{color:var(--apricot)}

.page-label{
  font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--dim);margin:0 4px 14px;
}

/* --- app grid --------------------------------------------- */
.grid{
  display:grid;grid-template-columns:repeat(4,1fr);
  gap:20px 8px;padding-bottom:20px;
}
.app{
  display:flex;flex-direction:column;align-items:center;gap:7px;
  transition:transform .22s var(--ease);
}
.app:active{transform:scale(.88)}
.icon{
  width:60px;height:60px;border-radius:19px;
  display:grid;place-items:center;overflow:hidden;
  font-family:var(--display);font-weight:800;font-size:25px;color:#120C1C;
  box-shadow:0 8px 20px -6px rgba(0,0,0,.65), inset 0 1px 0 rgba(255,255,255,.35);
  position:relative;
}
.icon img{width:100%;height:100%;object-fit:cover}
.icon::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(160deg,rgba(255,255,255,.34),transparent 55%);
}
.app .label{
  font-size:10.5px;color:rgba(255,255,255,.88);text-align:center;line-height:1.25;
  text-shadow:0 1px 3px rgba(0,0,0,.6);max-width:74px;
}

/* --- dock -------------------------------------------------- */
.dock{
  margin-top:auto;position:sticky;bottom:0;
  background:var(--glass-2);border:1px solid var(--line);
  backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);
  border-radius:30px;padding:13px 10px;
  display:grid;grid-template-columns:repeat(4,1fr);gap:6px;
  margin-bottom:26px;
}
.dock .app .label{font-size:9.5px}
.dock .icon{width:52px;height:52px;border-radius:16px;font-size:20px}
.home-bar{
  position:absolute;bottom:8px;left:50%;transform:translateX(-50%);
  width:128px;height:5px;border-radius:99px;background:rgba(255,255,255,.4);z-index:40;
  pointer-events:none;
}

/* ============================================================
   APP VIEW (the sheet that opens)
   ============================================================ */
.view{
  position:absolute;inset:0;z-index:50;
  background:var(--wall-btm);
  overflow-y:auto;overflow-x:hidden;
  scrollbar-width:none;
  opacity:0;pointer-events:none;
  transform:scale(.28);
  border-radius:22px;
  transform-origin:var(--ox,50%) var(--oy,50%);
  transition:transform .46s var(--ease), opacity .28s ease, border-radius .46s var(--ease);
}
.view::-webkit-scrollbar{display:none}
.view.open{opacity:1;pointer-events:auto;transform:scale(1);border-radius:0}

.view-head{
  position:relative;padding:64px 22px 26px;
  background:linear-gradient(165deg,var(--tint,#333) 0%, transparent 100%);
  border-bottom:1px solid var(--line);
}
.back{
  position:absolute;top:52px;left:14px;z-index:5;
  width:36px;height:36px;border-radius:50%;
  background:rgba(0,0,0,.35);backdrop-filter:blur(10px);
  display:grid;place-items:center;
}
.view-head .icon{margin-bottom:16px}
.view-head h2{
  font-family:var(--display);font-size:29px;font-weight:800;letter-spacing:-.03em;line-height:1.05;
}
.view-head .tagline{color:var(--muted);font-size:14.5px;margin-top:8px;line-height:1.55}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.chip{
  font-family:var(--mono);font-size:10px;letter-spacing:.05em;
  padding:5px 10px;border-radius:8px;
  background:rgba(255,255,255,.08);border:1px solid var(--line);color:var(--muted);
}

.view-body{padding:26px 22px 60px}
.block{margin-bottom:30px}
.block h3{
  font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--dim);margin-bottom:10px;
}
.block p{font-size:14.5px;line-height:1.72;color:#D9D4E6}
.block p + p{margin-top:12px}
.block strong{color:var(--text);font-weight:600}

.highlight{
  border-left:2px solid var(--tint,var(--apricot));
  padding:2px 0 2px 16px;
}

/* --- screenshot gallery ----------------------------------- */
.gallery{
  display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;
  margin:0 -22px;padding:4px 22px 14px;scrollbar-width:none;
}
.gallery::-webkit-scrollbar{display:none}
.shot{
  flex:0 0 152px;height:330px;border-radius:20px;overflow:hidden;
  scroll-snap-align:center;border:1px solid var(--line);
  background:#100E1A;cursor:zoom-in;
  transition:transform .25s var(--ease);
}
.shot:hover{transform:translateY(-4px)}
.shot img{width:100%;height:100%;object-fit:cover;display:block}
.shot.empty{
  border:1px dashed rgba(255,255,255,.22);cursor:default;
  display:grid;place-items:center;text-align:center;padding:18px;
}
.shot.empty span{font-family:var(--mono);font-size:10px;color:var(--dim);line-height:1.8}

.links{display:flex;flex-direction:column;gap:8px}
.linkrow{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:14px 16px;border-radius:14px;
  background:var(--glass);border:1px solid var(--line);
  text-decoration:none;font-size:13.5px;font-weight:500;
  transition:.22s var(--ease);
}
.linkrow:hover{background:var(--glass-2);border-color:rgba(255,255,255,.3);transform:translateX(3px)}
.linkrow span:last-child{font-family:var(--mono);font-size:11px;color:var(--dim)}

/* --- certificates ----------------------------------------- */
.cert-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cert{
  background:var(--glass);border:1px solid var(--line);border-radius:16px;
  overflow:hidden;text-align:left;transition:.22s var(--ease);
}
.cert:hover{border-color:rgba(255,255,255,.3);transform:translateY(-3px)}
.cert .thumb{
  height:104px;background:#100E1A;display:grid;place-items:center;
  border-bottom:1px solid var(--line);
}
.cert .thumb img{width:100%;height:100%;object-fit:cover;object-position:center top}
.cert .thumb.empty{font-family:var(--mono);font-size:9px;color:var(--dim);text-align:center;padding:8px}
.cert .meta{padding:11px 12px}
.cert .meta strong{display:block;font-size:12.5px;font-weight:600;line-height:1.35}
.cert .meta span{display:block;font-family:var(--mono);font-size:9.5px;color:var(--dim);margin-top:5px;letter-spacing:.05em}

/* --- skills ----------------------------------------------- */
.skillset{margin-bottom:22px}
.skillset h4{
  font-size:12px;font-weight:600;color:var(--apricot);margin-bottom:9px;
  font-family:var(--mono);letter-spacing:.08em;text-transform:uppercase;
}

/* ============================================================
   LIGHTBOX
   ============================================================ */
.lightbox{
  position:fixed;inset:0;z-index:200;
  background:rgba(6,4,12,.93);backdrop-filter:blur(14px);
  display:grid;place-items:center;padding:28px;
  opacity:0;pointer-events:none;transition:opacity .3s ease;
}
.lightbox.open{opacity:1;pointer-events:auto}
.lightbox img{max-width:100%;max-height:88dvh;border-radius:14px;box-shadow:0 30px 80px rgba(0,0,0,.7)}
.lightbox .close{
  position:absolute;top:22px;right:22px;width:42px;height:42px;border-radius:50%;
  background:var(--glass-2);border:1px solid var(--line);display:grid;place-items:center;
}

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (max-width:900px){
  .stage{flex-direction:column;gap:34px;padding:34px 18px}
  .intro{max-width:100%;text-align:center}
  .eyebrow{justify-content:center}
  .intro p{margin:0 auto}
  .intro .hint{display:none}
  .social{justify-content:center}
  .device{
    width:min(390px,100%);height:min(830px,80dvh);
    padding:9px;border-radius:44px;
  }
  .screen{border-radius:36px}
}
@media (max-width:420px){
  .device{border-radius:38px;padding:0;background:none;box-shadow:none;height:78dvh}
  .screen{border-radius:26px;box-shadow:0 20px 50px rgba(0,0,0,.6)}
  .notch{display:none}
  .statusbar{height:36px}
  .home{padding-top:44px}
}
@media (prefers-reduced-motion:reduce){
  *{transition-duration:.01ms !important;animation-duration:.01ms !important}
  .view{transform:none}
}
</style>
</head>
<body>

<main class="stage">

  <!-- ═══════════ LEFT COLUMN ═══════════ -->
  <section class="intro">
    <p class="eyebrow" id="introEyebrow">Open to work</p>
    <h1>I build<br>things that<em>live in your pocket.</em></h1>
    <p id="introBio">Mobile developer. Seven shipped apps, each taken from an empty project folder to something people actually open on a Tuesday morning.</p>
    <p class="hint">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M9 11V6a2 2 0 1 1 4 0v5"/><path d="M13 11V8a2 2 0 1 1 4 0v3"/><path d="M17 11v-1a2 2 0 1 1 4 0v6a6 6 0 0 1-6 6h-2a7 7 0 0 1-7-7v-3a2 2 0 1 1 4 0"/></svg>
      Tap any app to open it
    </p>
    <nav class="social" id="socialLinks"></nav>
  </section>

  <!-- ═══════════ PHONE ═══════════ -->
  <section class="device">
    <div class="notch"></div>
    <div class="screen">

      <div class="statusbar">
        <span id="clock">9:41</span>
        <span class="icons">
          <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect x="0" y="7.5" width="3" height="3.5" rx="1"/><rect x="4.5" y="5" width="3" height="6" rx="1"/><rect x="9" y="2.5" width="3" height="8.5" rx="1"/><rect x="13.5" y="0" width="3" height="11" rx="1"/></svg>
          <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor"><path d="M8 11.2 5.6 8.6a3.4 3.4 0 0 1 4.8 0L8 11.2Zm0-5.4a6.4 6.4 0 0 0-4.5 1.9L1.9 6.1a8.7 8.7 0 0 1 12.2 0l-1.6 1.6A6.4 6.4 0 0 0 8 5.8Z"/></svg>
          <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x=".7" y=".7" width="20" height="10.6" rx="3.2" stroke="currentColor" stroke-opacity=".45"/><rect x="2.4" y="2.4" width="14" height="7.2" rx="1.9" fill="currentColor"/><path d="M22.4 4.2v3.6a2 2 0 0 0 0-3.6Z" fill="currentColor" fill-opacity=".45"/></svg>
        </span>
      </div>

      <!-- HOME SCREEN -->
      <div class="home" id="home">
        <div class="widget">
          <div class="avatar" id="avatar">YN</div>
          <div class="who">
            <strong id="wName">Your Name</strong>
            <span id="wRole">Mobile Developer</span>
            <span class="badge"><i></i> <span id="wStatus">Available</span></span>
          </div>
          <a class="cv" id="cvLink" href="#" download>CV<br>↓</a>
        </div>

        <p class="page-label">Projects</p>
        <div class="grid" id="appGrid"></div>

        <nav class="dock" id="dock"></nav>
      </div>

      <!-- APP VIEW -->
      <article class="view" id="view" role="dialog" aria-modal="true" aria-label="Project detail"></article>

      <div class="home-bar"></div>
    </div>
  </section>
</main>

<div class="lightbox" id="lightbox">
  <button class="close" aria-label="Close image">
    <svg width="19" height="19" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
  </button>
  <img id="lightboxImg" alt="">
</div>

<script>
/* ══════════════════════════════════════════════════════════════

   ══════════════════════════════════════════════════════════════ */

const PROFILE = {
  name:   "Mohammad Ahmed",
  role:   "Mobile Developer",
  status: "Open to work",
  monogram: "MA",                  // shows if photo is missing
  photo:  "",                      // e.g. "images/me.jpg"
  resume: "images/resume.pdf",        // put your PDF in the images folder
  email:  "you@example.com",
  socials: [
    { label: "GitHub",   url: "https://github.com/yourhandle" },
    { label: "LinkedIn", url: "https://linkedin.com/in/yourhandle" },

  about: [

  skills: [

    { group: "Tooling",  items: "Git · Figma · Play Console · CI basics" }
  ]
};

/* ── YOUR APPS ────────────────────────────────────────────────
   color     : the icon colour + the wash behind the header
   monogram  : letter shown if no icon image
   icon      : "images/split-icon.png"  (optional)
   screenshots: ["images/split-1.png","images/split-2.png"]  (leave [] for now)
   highlight : the paragraph recruiters actually read. Be specific.
   ──────────────────────────────────────────────────────────── */
const APPS = [
  {
    name: "Splitwise Lite",
    monogram: "S",
    color: "#FFB367",
    icon: "",
    tagline: "Scan a restaurant receipt, split it by who ate what.",
    problem: "Splitting a group bill always ended in someone doing arithmetic on a napkin. Existing apps made you type every line item by hand, which took longer than just paying the whole thing yourself.",
    role: "Solo — design, Flutter app, OCR pipeline, and the Firebase backend.",
    highlight: "Receipt OCR returns line items in an unpredictable order with inconsistent spacing, so a naive parser mismatched prices to items about a third of the time. I ended up grouping detected text by vertical position with a tolerance band instead of parsing line by line, which pushed accuracy past 90% on crumpled receipts. Everything also had to work offline, so the split state lives in a local queue and reconciles with Firestore when the connection comes back.",
    stack: ["Flutter", "Dart", "Firebase", "ML Kit OCR", "Hive"],
    screenshots: [],
    links: [
      { label: "Source code", url: "#", note: "GitHub" },
      { label: "Download APK", url: "#", note: "v1.4" }
    ]
  },
  {
    name: "Nimbus",
    monogram: "N",
    color: "#6FE3C0",
    icon: "",
    tagline: "A weather app that only tells you what changes your day.",

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- clock ---------- */

  const d = new Date();
  let h = d.getHours() % 12 || 12;
  $("#clock").textContent = h + ":" + String(d.getMinutes()).padStart(2, "0");
};
tick(); setInterval(tick, 20000);

/* ---------- icon markup ---------- */
function iconHTML(item, big) {
  const inner = item.icon
    ? `<img src="${esc(item.icon)}" alt="">`
    : esc(item.monogram || item.name[0]);
  return `<div class="icon" style="background:linear-gradient(150deg,${item.color},${shade(item.color,-32)})">${inner}</div>`;
}
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const c = [(n >> 16) & 255, (n >> 8) & 255, n & 255]
    .map(v => Math.max(0, Math.min(255, v + amt)));
  return "#" + c.map(v => v.toString(16).padStart(2, "0")).join("");
}

/* ---------- home grid ---------- */
$("#appGrid").innerHTML = APPS.map((a, i) =>

   </button>`).join("");

/* ---------- gallery ---------- */
function galleryHTML(shots, name) {
  if (!shots || !shots.length) {
    return `<div class="gallery">${[1,2,3].map(n =>
      `<div class="shot empty"><span>screenshot ${n}<br>↓<br>images/${slug(name)}-${n}.png</span></div>`
    ).join("")}</div>`;
  }
  return `<div class="gallery">${shots.map(s =>
    `<button class="shot" data-full="${esc(s)}"><img src="${esc(s)}" alt="${esc(name)} screenshot" loading="lazy"></button>`
  ).join("")}</div>`;
}
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");

/* ---------- view builders ---------- */

  return `

    <div class="block"><h3>The problem</h3><p>${esc(a.problem)}</p></div>

  </div>`;
}
function headHTML(item, tagline, stack) {

}

/* ---------- open / close ---------- */
const view = $("#view"), screen = document.querySelector(".screen");
let isOpen = false;

function open(html, originEl) {
  const s = screen.getBoundingClientRect();
  const o = originEl.getBoundingClientRect();
  view.style.setProperty("--ox", ((o.left + o.width/2 - s.left) / s.width * 100) + "%");
  view.style.setProperty("--oy", ((o.top + o.height/2 - s.top) / s.height * 100) + "%");
  view.innerHTML = html;
  view.scrollTop = 0;
  requestAnimationFrame(() => view.classList.add("open"));
  isOpen = true;
}
function close() {
  view.classList.remove("open");
  isOpen = false;
  setTimeout(() => { if (!isOpen) view.innerHTML = ""; }, 480);
}

document.addEventListener("click", e => {
  const appBtn = e.target.closest("[data-app]");
  if (appBtn) return open(appHTML(APPS[+appBtn.dataset.app]), appBtn);

  const pageBtn = e.target.closest("[data-page]");
  if (pageBtn) return open(PAGES[pageBtn.dataset.page](), pageBtn);

  if (e.target.closest("[data-close]")) return close();

  const zoom = e.target.closest("[data-full]");
  if (zoom) {
    $("#lightboxImg").src = zoom.dataset.full;
    $("#lightbox").classList.add("open");
    return;
  }
  if (e.target.closest("#lightbox")) $("#lightbox").classList.remove("open");
});

document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if ($("#lightbox").classList.contains("open")) $("#lightbox").classList.remove("open");
  else if (isOpen) close();
});

/* swipe down on the view to go home */
let startY = null;
view.addEventListener("touchstart", e => { if (view.scrollTop <= 0) startY = e.touches[0].clientY; }, {passive:true});
view.addEventListener("touchmove", e => {
  if (startY !== null && e.touches[0].clientY - startY > 90) { close(); startY = null; }
}, {passive:true});
view.addEventListener("touchend", () => { startY = null; });
</script>
